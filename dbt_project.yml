name: 'iot_semantic_layer'
version: '1.0.0'
config-version: 2

profile: 'iot_semantic'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  iot_semantic_layer:
    staging:
      +materialized: view
      +schema: staging
    semantics:
      +materialized: table
      +schema: semantic
      +tags: ["semantic_layer"]

seeds:
  +quote_columns: false
  +schema: seed_data

require-dbt-version: [">=1.7.0", "<2.0.0"]

vars:
  env: "{{ env_var('ENVIRONMENT', 'development') }}"
  alert_threshold_zscore: 2.5
  device_offline_threshold_minutes: 15
  driver_risk_window_days: 30
