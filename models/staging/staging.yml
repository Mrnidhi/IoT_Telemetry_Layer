version: 2

models:
  - name: stg_trip_events
    description: "Staged trip events with cleansed and validated data"
    columns:
      - name: trip_id
        description: "Unique trip identifier"
        data_type: VARCHAR
        data_tests:
          - unique
          - not_null
      - name: device_id
        description: "IoT device identifier"
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: driver_id
        description: "Driver identifier"
        data_type: VARCHAR
      - name: trip_start_time
        description: "Trip start timestamp (UTC)"
        data_type: TIMESTAMP_NTZ
        data_tests:
          - not_null
      - name: trip_end_time
        description: "Trip end timestamp (UTC)"
        data_type: TIMESTAMP_NTZ
      - name: distance_km
        description: "Trip distance in kilometers"
        data_type: FLOAT
      - name: duration_seconds
        description: "Trip duration in seconds"
        data_type: INTEGER
      - name: avg_speed_kmh
        description: "Average speed in km/h"
        data_type: FLOAT
      - name: max_speed_kmh
        description: "Maximum speed in km/h"
        data_type: FLOAT
      - name: harsh_brakes_count
        description: "Count of harsh braking events"
        data_type: INTEGER
      - name: harsh_accelerations_count
        description: "Count of harsh acceleration events"
        data_type: INTEGER
      - name: route_polyline
        description: "Encoded trip route"
        data_type: VARCHAR

  - name: stg_sensor_heartbeats
    description: "Staged sensor heartbeat signals with health status"
    columns:
      - name: heartbeat_id
        description: "Unique heartbeat record ID"
        data_type: VARCHAR
        data_tests:
          - unique
          - not_null
      - name: device_id
        description: "IoT device ID"
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: heartbeat_timestamp
        description: "When heartbeat was received (UTC)"
        data_type: TIMESTAMP_NTZ
        data_tests:
          - not_null
      - name: signal_strength_dbm
        description: "Signal strength in dBm"
        data_type: INTEGER
      - name: battery_percent
        description: "Battery charge percentage"
        data_type: INTEGER
      - name: gps_accuracy_meters
        description: "GPS accuracy in meters"
        data_type: FLOAT
      - name: device_temperature_c
        description: "Device temperature in Celsius"
        data_type: FLOAT
      - name: is_online
        description: "Device online status"
        data_type: BOOLEAN

  - name: stg_devices
    description: "Device master data with metadata"
    columns:
      - name: device_id
        description: "Unique device identifier"
        data_type: VARCHAR
        data_tests:
          - unique
          - not_null
      - name: device_model
        description: "Device hardware model"
        data_type: VARCHAR
      - name: firmware_version
        description: "Current firmware version"
        data_type: VARCHAR
      - name: fleet_id
        description: "Fleet identifier"
        data_type: VARCHAR
      - name: installation_date
        description: "When device was installed"
        data_type: DATE
      - name: is_active
        description: "Device operational status"
        data_type: BOOLEAN
